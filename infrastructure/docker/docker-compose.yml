name: atlas
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports: ['15432:5432']
    volumes: [atlas-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas -d atlas']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ['16379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: atlas
      MINIO_ROOT_PASSWORD: atlas-local-secret
    ports: ['19000:9000', '19001:9001']
    volumes: [atlas-minio:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.26
    ports: ['11025:1025', '18025:8025']
volumes:
  atlas-postgres:
  atlas-minio:
